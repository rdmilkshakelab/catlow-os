name: Build Catlow OS ISO

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-os:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build the OS compilation environment
      run: |
        echo "Starting Docker environment build..."
        make build

    - name: Compile Kernel, BusyBox, and Package ISO
      run: |
        mkdir -p output
        docker run --rm \
          -v ${{ github.workspace }}/src:/src \
          -v ${{ github.workspace }}/output:/output \
          catlow-build /bin/bash -c "
            echo '=== Step 1: Compiling Linux Kernel ===' && \
            cd /build/linux-6.6.21 && \
            make defconfig && \
            make -j\$(nproc) bzImage && \
            cp arch/x86/boot/bzImage /build/rootfs/vmlinuz && \
            
            echo '=== Step 2: Compiling BusyBox ===' && \
            cd /build/busybox-1.36.1 && \
            make defconfig && \
            sed -i 's/# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config && \
            make -j\$(nproc) install && \
            cp -r _install/* /build/rootfs/ && \
            
            echo '=== Step 3: Structuring Virtual Filesystem ===' && \
            cd /build/rootfs && \
            mkdir -p dev proc sys etc boot && \
            cp /src/init.sh init && \
            chmod +x init && \
            
            echo '=== Step 4: Creating Initial RAM Disk (initramfs) ===' && \
            find . -print0 | cpio --null -ov --format=newc | gzip -9 > /build/initramfs.cpio.gz && \
            
            echo '=== Step 5: Master Bootable Assembly ===' && \
            mkdir -p /build/iso/boot/syslinux && \
            cp /build/rootfs/vmlinuz /build/iso/boot/vmlinuz && \
            cp /build/initramfs.cpio.gz /build/iso/boot/initramfs.cpio.gz && \
            cp /src/syslinux.cfg /build/iso/boot/syslinux/syslinux.cfg && \
            
            cp /usr/lib/ISOLINUX/isolinux.bin /build/iso/boot/syslinux/ && \
            cp /usr/lib/syslinux/modules/bios/ldlinux.c32 /build/iso/boot/syslinux/ && \
            
            xorriso -as mkisofs -o /output/catlow-os.iso \
              -b boot/syslinux/isolinux.bin \
              -c boot/syslinux/boot.cat \
              -no-emul-boot -boot-load-size 4 -boot-info-table \
              /build/iso && \
            echo '=== OS Compilation Complete! ==='
          "

    - name: Upload Catlow OS ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: catlow-os-iso
        path: output/catlow-os.iso
        if-no-files-found: error
        retention-days: 7
