# ==============================================================================
# Catlow OS - Bootloader Configuration (Syslinux)
# Created by Alfie Catlow
# ==============================================================================

# Timeouts and display settings
DEFAULT catlow
PROMPT 1
TIMEOUT 50

# Main boot entry for Catlow OS
LABEL catlow
  MENU LABEL Catlow OS v1.0.0
  KERNEL /boot/vmlinuz
  INITRD /boot/initramfs.cpio.gz
  APPEND rw root=/dev/ram0 console=tty0

